[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reckon_copilot"
version = "0.0.1"
description = "Reckon Copilot for Frappe and ERPNext v16+"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "Reckon Technologies Ltd.", email = "hello@reckon.tech" }
]
dependencies = []

[project.urls]
Homepage = "https://www.reckon.tech"

[tool.setuptools]
packages = [
  "reckon_copilot",
  "reckon_copilot.api",
  "reckon_copilot.context",
  "reckon_copilot.permissions",
  "reckon_copilot.providers",
  "reckon_copilot.reckon_copilot",
  "reckon_copilot.reckon_copilot.doctype",
  "reckon_copilot.reckon_copilot.doctype.copilot_user_preference",
]
include-package-data = true
